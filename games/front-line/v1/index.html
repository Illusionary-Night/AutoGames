<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前線輪替</title>
<style>
  :root { --bg:#fafafa; --fg:#1c1c1e; --muted:#6b6b70; --card:#fff; --line:#d9d9de; --front:#eef3ff;
          --atk:#d93d42; --def:#3e63dd; --spd:#218358; --good:#218358; --bad:#d93d42; --warn:#b25e00; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --fg:#ececee; --muted:#9a9aa1; --card:#1f1f22; --line:#38383f; --front:#1d2538;
            --atk:#ff6369; --def:#7b9bff; --spd:#4cc38a; --good:#4cc38a; --bad:#ff6369; --warn:#ffa94d; --accent:#6c9cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; }
  h1 { font-size:21px; margin:0; }
  .stats { font-variant-numeric:tabular-nums; }
  details { color:var(--muted); font-size:13px; margin:6px 0 8px; }
  details ul { margin:6px 0; padding-left:18px; }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .cell { min-height:52px; border:1px solid var(--line); border-radius:8px; background:var(--card);
          display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
  .cell.next { min-height:32px; border-style:dashed; background:transparent; font-size:13px; opacity:.75; }
  .cell.danger { border-color:var(--warn); border-width:2px; }
  button.cell { background:var(--front); min-height:84px; font:inherit; color:var(--fg); cursor:pointer; padding:2px; }
  button.cell.target { border:2px solid var(--accent); }
  button.cell:disabled { cursor:default; }
  .u { font-size:20px; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums; }
  .atk { color:var(--atk); } .def { color:var(--def); } .spd { color:var(--spd); }
  .sub { font-size:11px; color:var(--muted); line-height:1.25; }
  .pred { font-size:12px; font-weight:600; line-height:1.25; text-align:center; }
  .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .flash-kill { animation:kill .6s ease; } .flash-death, .flash-breach { animation:hurt .6s ease; }
  @keyframes kill { 30% { background:var(--good); transform:scale(1.07); } }
  @keyframes hurt { 15% { background:var(--bad); transform:translateX(-5px); } 35% { transform:translateX(5px); } 55% { transform:translateX(-3px); } }
  .label { font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .reserve { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .sol { border:2px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; padding:4px 2px; cursor:pointer; }
  .sol.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .sol:disabled { cursor:default; }
  .sol.dead { opacity:.3; }
  .actions { display:flex; gap:8px; margin-top:12px; align-items:center; }
  .go { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 22px; font:inherit; font-weight:600; cursor:pointer; }
  .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; }
  .ghost:disabled, .go:disabled { opacity:.4; cursor:default; }
  .msg { margin-top:8px; min-height:44px; font-size:14px; }
  footer { margin-top:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <header><h1>前線輪替</h1><div class="stats" id="stats"></div></header>
  <details open>
    <summary>怎麼玩</summary>
    <ul>
      <li>敵人每回合往下一格。撐過 14 波並清光敵人就獲勝，漏掉 3 個就失敗。</li>
      <li><b>每回合只能下 1 個指令</b>：派一名士兵上前線（可直接換下原本的人），或撤下一名。然後按「結束回合」。</li>
      <li>戰力不低於敵人就獲勝，但會累積疲勞。戰力較低則陣亡（永久），敵人被削弱後留在原地。</li>
      <li>後方士兵每回合恢復 4 點疲勞；沒有疲勞時改為訓練，戰力 +1（最多 +3）。前線士兵不恢復。</li>
      <li>剋制時戰力 ×1.5：▲ 剋 ●，● 剋 ■，■ 剋 ▲。</li>
    </ul>
  </details>

  <div class="label">下一回合出現</div>
  <div class="board" id="next"></div>
  <div class="label">敵軍（橘框：這回合結束就交戰）</div>
  <div class="board" id="board"></div>
  <div class="label">前線</div>
  <div class="board" id="front"></div>
  <div class="label">後方（點士兵，再點前線欄位）</div>
  <div class="reserve" id="reserve"></div>

  <div class="actions">
    <button class="go" id="end">結束回合</button>
    <button class="ghost" id="undo" disabled>取消指令</button>
    <button class="ghost" id="restart">新的一局</button>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <footer>遊戲代號：FL-1（填問卷時請照抄）</footer>
</main>
<script src="engine.js"></script>
<script>
const E = Engine, $ = id => document.getElementById(id);
const ICON = { atk:'▲', def:'■', spd:'●' };
let state, view, order, sel, flashes = {}, busy = false, audio;

function beep(freq, dur, type = 'square', delay = 0) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + delay;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

function start() {
  state = E.newGame(Math.floor(Math.random() * 1e9));
  order = null; sel = null; flashes = {}; $('msg').textContent = '敵人正在接近。先把士兵派到會被攻擊的欄位。';
  refresh();
}

function refresh() {
  view = E.clone(state);
  if (order) E.applyOrder(view, order);
  render();
}

const unit = (type, n) => `<span class="u ${type}">${ICON[type]}${n}</span>`;
const detail = x => [x.train ? `訓+${x.train}` : '', x.fat ? `疲−${x.fat}` : ''].filter(Boolean).join(' ') || '精神飽滿';
const nearest = col => view.enemies.filter(e => e.col === col).sort((a, b) => b.row - a.row)[0];

function predict(soldier, col) {
  const e = nearest(col), last = view.p.rows - 1;
  if (!e) return '<div class="pred sub">無敵人</div>';
  const d = E.duel(view.p, soldier, e), wait = last - e.row;
  const when = wait <= 0 ? '本回合' : `${wait} 回合後`;
  const strength = `<div class="sub">${d.sp % 1 ? d.sp.toFixed(1) : d.sp} 對 ${d.ep % 1 ? d.ep.toFixed(1) : d.ep}</div>`;
  return d.win ? `<div class="pred good">${when}勝<br>疲+${d.fatigue}</div>${strength}` : `<div class="pred bad">${when}陣亡</div>${strength}`;
}

function render() {
  const p = view.p, last = p.rows - 1;
  $('stats').textContent = `波次 ${Math.min(state.turn + 1, p.waves)}／${p.waves}　防線 ${'♥'.repeat(Math.max(0, view.lives))}${'♡'.repeat(p.lives - Math.max(0, view.lives))}`;
  const wave = view.waves[view.turn + 1] || [];
  $('next').innerHTML = [...Array(p.cols).keys()].map(c => {
    const e = wave.find(x => x.col === c);
    return `<div class="cell next">${e ? `<span class="${e.type}">${ICON[e.type]}${e.str}</span>` : ''}</div>`;
  }).join('');

  let html = '';
  for (let r = 0; r < p.rows; r++) for (let c = 0; c < p.cols; c++) {
    const e = view.enemies.find(x => x.row === r && x.col === c);
    const queued = r === 0 ? view.enemies.filter(x => x.col === c && x.row < 0).length : 0;
    html += `<div class="cell ${e && r === last ? 'danger' : ''}">${e ? unit(e.type, e.str) : ''}${queued ? `<span class="sub">後面還有 ${queued}</span>` : ''}</div>`;
  }
  $('board').innerHTML = html;

  $('front').innerHTML = [...Array(p.cols).keys()].map(c => {
    const x = E.frontAt(view, c), e = nearest(c);
    let body;
    if (sel !== null) body = `<div class="sub">派到這裡</div>${predict(view.soldiers[sel], c)}`;
    else if (x) body = `${unit(x.type, E.power(x))}<div class="sub">${detail(x)}</div>${predict(x, c)}`;
    else body = e && e.row === last ? '<div class="pred warn">將漏敵</div>' : '<div class="sub">空</div>';
    return `<button class="cell ${sel !== null ? 'target' : ''} ${flashes[c] ? 'flash-' + flashes[c] : ''}" data-col="${c}" ${busy || state.over || (order && sel === null) || (sel === null && !x) ? 'disabled' : ''} title="${x && sel === null ? '點一下撤下' : ''}">${body}</button>`;
  }).join('');

  $('reserve').innerHTML = view.soldiers.map(x => {
    if (x.dead) return `<button class="sol dead" disabled>${unit(x.type, '')}<div class="sub">陣亡</div></button>`;
    if (x.col !== null) return `<button class="sol dead" disabled>${unit(x.type, E.power(x))}<div class="sub">前線 ${x.col + 1}</div></button>`;
    const after = x.fat ? `休息：疲−${Math.max(0, x.fat - p.rest)}` : x.train < p.trainCap ? '訓練中 +1' : '訓練已滿';
    return `<button class="sol ${sel === x.id ? 'sel' : ''}" data-id="${x.id}" ${busy || state.over || order ? 'disabled' : ''}>${unit(x.type, E.power(x))}<div class="sub">${detail(x)}<br>${after}</div></button>`;
  }).join('');

  $('front').querySelectorAll('button').forEach(b => b.onclick = () => clickFront(+b.dataset.col));
  $('reserve').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { sel = sel === +b.dataset.id ? null : +b.dataset.id; render(); });
  $('undo').disabled = busy || !order;
  $('end').disabled = busy || !!state.over;
}

function clickFront(col) {
  if (order) return;
  const x = E.frontAt(state, col);
  if (sel !== null) order = { k:'deploy', s:sel, col };
  else if (x) order = { k:'withdraw', s:x.id };
  else return;
  sel = null; beep(520, .08, 'triangle');
  $('msg').textContent = '指令已下。按「結束回合」執行，或取消重選。';
  refresh();
}

function endTurn() {
  if (busy || state.over) return;
  if (order) E.applyOrder(state, order);
  const events = E.endTurn(state);
  order = null; sel = null; flashes = {};
  const lines = events.map((ev, i) => {
    flashes[ev.col] = ev.k;
    if (ev.k === 'kill') { beep(660, .12, 'square', i * .12); return `第 ${ev.col + 1} 欄擊退敵人`; }
    if (ev.k === 'death') { beep(150, .3, 'sawtooth', i * .12); return `<span class="bad">第 ${ev.col + 1} 欄士兵陣亡（敵人 −${ev.dmg}）</span>`; }
    beep(90, .4, 'sawtooth', i * .12); return `<span class="bad">第 ${ev.col + 1} 欄防線被突破！</span>`;
  });
  if (state.over) {
    const alive = state.soldiers.filter(x => !x.dead).length;
    lines.push(state.over === 'win' ? `<b class="good">守住了！存活士兵 ${alive}／${state.soldiers.length}</b>` : `<b class="bad">防線失守（撐到第 ${state.turn} 回合）</b>`);
    if (state.over === 'win') [523, 659, 784].forEach((f, i) => beep(f, .25, 'triangle', .3 + i * .15));
  }
  $('msg').innerHTML = lines.join('；') || '敵人前進了一格。';
  refresh();
  flashes = {};
}

$('end').onclick = endTurn;
$('undo').onclick = () => { order = null; sel = null; refresh(); };
$('restart').onclick = start;
start();
</script>
</body>
</html>
