<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流動平衡</title>
<style>
  :root { --bg:#fafafa; --fg:#1c1c1e; --muted:#6b6b70; --card:#fff; --line:#d9d9de;
          --atk:#e5484d; --def:#3e63dd; --spd:#30a46c; --up:#30a46c; --down:#e5484d; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --fg:#ececee; --muted:#9a9aa1; --card:#1f1f22; --line:#38383f;
            --atk:#ff6369; --def:#7b9bff; --spd:#4cc38a; --up:#4cc38a; --down:#ff6369; --accent:#6c9cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:22px; margin:0; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .score { font-size:18px; font-variant-numeric:tabular-nums; }
  .hint { color:var(--muted); font-size:14px; margin:4px 0 12px; }
  .rules { color:var(--muted); font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--card); margin-bottom:12px; }
  .units { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; }
  .unit { display:grid; grid-template-columns:36px 1fr; gap:4px 10px; align-items:center; text-align:left; width:100%;
          background:var(--card); color:var(--fg); border:2px solid var(--line); border-radius:10px; padding:8px 10px; cursor:pointer; font:inherit; }
  .unit:hover:not(:disabled) { border-color:var(--accent); }
  .unit.picked { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .unit:disabled { cursor:default; }
  .icon { font-size:28px; text-align:center; line-height:1; }
  .t-atk .icon { color:var(--atk); } .t-def .icon { color:var(--def); } .t-spd .icon { color:var(--spd); }
  .name { font-weight:600; }
  .name small { color:var(--muted); font-weight:400; margin-left:4px; }
  .bar { grid-column:1 / 3; height:8px; background:var(--line); border-radius:4px; position:relative; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); width:50%; transition:width .6s ease; }
  .bar b { position:absolute; left:calc(100%/2.3 * 1); top:-1px; bottom:-1px; width:2px; background:var(--fg); opacity:.5; }
  .val { grid-column:1 / 3; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; display:flex; justify-content:space-between; }
  .up { color:var(--up); } .down { color:var(--down); }
  h2 { font-size:16px; margin:20px 0 8px; }
  .lanes { display:grid; gap:8px; }
  .lane { display:grid; grid-template-columns:44px 1fr 28px 1fr; gap:8px; align-items:center; background:var(--card);
          border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-height:56px; }
  .lane .n { color:var(--muted); font-size:13px; }
  .slot { display:flex; align-items:center; gap:6px; min-height:36px; }
  .slot.empty { color:var(--muted); font-size:14px; }
  .slot .sc { margin-left:auto; font-size:14px; font-variant-numeric:tabular-nums; color:var(--muted); }
  .vs { text-align:center; color:var(--muted); font-size:13px; }
  .lane.win { border-color:var(--up); } .lane.lose { border-color:var(--down); }
  .lane.win, .lane.lose { animation:pop .35s ease; }
  @keyframes pop { 0% { transform:scale(.97); } 60% { transform:scale(1.02); } 100% { transform:scale(1); } }
  .actions { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  button.go { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button.go:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 16px; font:inherit; cursor:pointer; }
  .msg { font-weight:600; }
  a { color:var(--accent); }
  footer { margin-top:24px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>流動平衡</h1>
    <div class="score" id="score"></div>
  </header>
  <p class="hint" id="hint"></p>
  <div class="rules">每回合選 3 個單位放進戰線，對手也會選 3 個。每條戰線比分數：強度 × 倍率，剋制對手再 ×1.4（▲ 剋 ●，● 剋 ■，■ 剋 ▲）。贏 2 條戰線得 1 分，先得 4 分獲勝，最多 7 回合。回合結束後：贏的單位倍率 −0.15，輸的 +0.15，沒出場的 +0.05。</div>

  <h2>單位與目前倍率</h2>
  <div class="units" id="units"></div>

  <h2>戰線（依序點單位加入，再點一次移出）</h2>
  <div class="lanes" id="lanes"></div>

  <div class="actions">
    <button class="go" id="go" disabled>出戰</button>
    <button class="ghost" id="next" style="display:none">下一回合</button>
    <span class="msg" id="msg"></span>
  </div>
  <footer>實驗版本 v1。玩完後請回首頁填寫問卷。</footer>
</main>
<script>
const UNITS = [
  { id:'a1', name:'鋒', type:'atk', base:8 }, { id:'a2', name:'爆', type:'atk', base:6 },
  { id:'d1', name:'盾', type:'def', base:8 }, { id:'d2', name:'壁', type:'def', base:6 },
  { id:'s1', name:'疾', type:'spd', base:8 }, { id:'s2', name:'影', type:'spd', base:6 },
];
const ICON = { atk:'▲', def:'■', spd:'●' };
const BEATS = { atk:'spd', spd:'def', def:'atk' };
const WIN_SCORE = 4, MAX_ROUNDS = 7, COUNTER = 1.4, DELTA = 0.15, IDLE = 0.05, MIN = 0.5, MAX = 1.8;
const $ = id => document.getElementById(id);
const byId = id => UNITS.find(u => u.id === id);

let mult, change, picks, round, score, locked, over;

function reset() {
  mult = {}; change = {}; UNITS.forEach(u => { mult[u.id] = 1; change[u.id] = 0; });
  picks = []; round = 1; score = { me:0, ai:0 }; locked = false; over = false;
  $('msg').textContent = ''; $('next').style.display = 'none';
  render(); renderLanes();
}

function render() {
  $('score').textContent = `回合 ${Math.min(round, MAX_ROUNDS)}／${MAX_ROUNDS}　你 ${score.me} : ${score.ai} 對手`;
  $('hint').textContent = over ? '' : (locked ? '' : '看看哪些單位被加強、哪些被削弱，選出這回合的 3 個。');
  $('units').innerHTML = UNITS.map(u => {
    const m = mult[u.id], c = change[u.id];
    const pct = ((m - MIN) / (MAX - MIN)) * 100;
    const arrow = c > 0 ? `<span class="up">▲ +${c.toFixed(2)}</span>` : c < 0 ? `<span class="down">▼ ${c.toFixed(2)}</span>` : '<span>—</span>';
    return `<button class="unit t-${u.type} ${picks.includes(u.id) ? 'picked' : ''}" data-id="${u.id}" ${locked || over ? 'disabled' : ''}>
      <div class="icon">${ICON[u.type]}</div>
      <div class="name">${u.name}<small>強度 ${u.base}</small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="val"><span>倍率 ×${m.toFixed(2)}　有效 ${(u.base * m).toFixed(1)}</span>${arrow}</div>
    </button>`;
  }).join('');
  document.querySelectorAll('.unit').forEach(b => b.onclick = () => toggle(b.dataset.id));
  $('go').disabled = picks.length !== 3 || locked || over;
}

function chip(u, extra = '') {
  return `<div class="slot t-${u.type}"><span class="icon">${ICON[u.type]}</span><span class="name">${u.name}</span>${extra}</div>`;
}

function renderLanes(res) {
  $('lanes').innerHTML = [0, 1, 2].map(i => {
    const mine = picks[i] ? byId(picks[i]) : null;
    const r = res && res[i];
    const cls = r ? (r.result > 0 ? 'win' : r.result < 0 ? 'lose' : '') : '';
    const left = mine ? chip(mine, r ? `<span class="sc">${r.my.toFixed(1)}</span>` : '') : '<div class="slot empty">（空）</div>';
    const right = r ? chip(byId(r.oppId), `<span class="sc">${r.opp.toFixed(1)}</span>`) : '<div class="slot empty">？</div>';
    return `<div class="lane ${cls}"><div class="n">戰線 ${i + 1}</div>${left}<div class="vs">VS</div>${right}</div>`;
  }).join('');
}

function toggle(id) {
  if (locked || over) return;
  const i = picks.indexOf(id);
  if (i >= 0) picks.splice(i, 1);
  else if (picks.length < 3) picks.push(id);
  render(); renderLanes();
}

function aiPick() {
  const scored = UNITS.map(u => ({ id:u.id, s:u.base * mult[u.id] * (0.5 + Math.random()) }));
  const ids = scored.sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  return ids;
}

function laneScore(u, opp) {
  return u.base * mult[u.id] * (BEATS[u.type] === opp.type ? COUNTER : 1);
}

async function fight() {
  locked = true; render();
  const opp = aiPick();
  const res = picks.map((id, i) => {
    const a = byId(id), b = byId(opp[i]);
    const my = laneScore(a, b), os = laneScore(b, a);
    return { oppId:b.id, my, opp:os, result: Math.abs(my - os) < 0.005 ? 0 : (my > os ? 1 : -1) };
  });
  // 逐條揭曉
  for (let i = 0; i < 3; i++) {
    renderLanes(res.map((r, k) => k <= i ? r : null));
    await new Promise(r => setTimeout(r, 600));
  }
  const w = res.filter(r => r.result > 0).length, l = res.filter(r => r.result < 0).length;
  let text;
  if (w >= 2) { score.me++; text = '本回合你得 1 分'; }
  else if (l >= 2) { score.ai++; text = '本回合對手得 1 分'; }
  else text = '本回合平手';

  // 自動平衡
  const used = new Set(), d = {};
  UNITS.forEach(u => d[u.id] = 0);
  res.forEach((r, i) => {
    used.add(picks[i]); used.add(r.oppId);
    if (r.result > 0) { d[picks[i]] -= DELTA; d[r.oppId] += DELTA; }
    else if (r.result < 0) { d[picks[i]] += DELTA; d[r.oppId] -= DELTA; }
  });
  UNITS.forEach(u => { if (!used.has(u.id)) d[u.id] += IDLE; });
  UNITS.forEach(u => {
    const nm = Math.min(MAX, Math.max(MIN, Math.round((mult[u.id] + d[u.id]) * 100) / 100));
    change[u.id] = Math.round((nm - mult[u.id]) * 100) / 100;
    mult[u.id] = nm;
  });

  if (score.me >= WIN_SCORE || score.ai >= WIN_SCORE || round >= MAX_ROUNDS) {
    over = true;
    text += score.me === score.ai ? '。遊戲結束：平手' : (score.me > score.ai ? '。遊戲結束：你贏了！' : '。遊戲結束：對手獲勝');
    $('next').textContent = '再玩一次';
  } else { round++; $('next').textContent = '下一回合'; }
  $('msg').textContent = text;
  $('next').style.display = '';
  locked = false; render();
  document.querySelectorAll('.unit').forEach(b => b.disabled = true);
  $('go').disabled = true;
}

$('go').onclick = fight;
$('next').onclick = () => {
  if (over) { reset(); return; }
  picks = []; $('msg').textContent = ''; $('next').style.display = 'none';
  render(); renderLanes();
};
reset();
</script>
</body>
</html>
