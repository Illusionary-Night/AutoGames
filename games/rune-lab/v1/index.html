<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>符文研究室</title>
<style>
  :root { --bg:#f7f6fb; --fg:#1d1b26; --muted:#6c6880; --card:#fff; --line:#d8d4e6; --accent:#6a45d9; --good:#218358;
          --empty:#eeecf5; --stone:#8b8d98; --wood:#a9743f; --grass:#5bb450; --water:#4b8fe2; --ice:#b5e6f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14121c; --fg:#ece9f6; --muted:#9c97b3; --card:#1e1b2a; --line:#37324a; --accent:#9a7bff; --good:#4cc38a;
            --empty:#252134; --stone:#62646f; --wood:#80552b; --grass:#3d8a35; --water:#2f69b0; --ice:#5d9db2; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 40px; }
  h1 { font-size:21px; margin:0 0 6px; }
  button { font:inherit; color:var(--fg); cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; }
  .tabs button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:3px 10px; font-size:14px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tabs button.done:not(.on) { border-color:var(--good); color:var(--good); }
  .goal { margin:10px 0 6px; }
  .goal small { color:var(--muted); }
  .board { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cell { aspect-ratio:1; border-radius:7px; background:var(--empty); display:flex; align-items:center; justify-content:center;
          font-size:clamp(14px,4.5vw,22px); font-weight:700; position:relative; transition:background .2s; }
  .t-s { background:var(--stone); color:#fff; } .t-w { background:var(--wood); color:#fff; } .t-g { background:var(--grass); color:#fff; }
  .t-a { background:var(--water); color:#fff; } .t-i { background:var(--ice); color:#12333f; }
  .t-l { border:2px dashed var(--muted); color:var(--muted); } .t-o { background:#ffd54a; color:#4a3500; box-shadow:0 0 14px #ffd54a; }
  .target { outline:3px dashed var(--good); outline-offset:-4px; }
  .me::after { content:attr(data-me); position:absolute; inset:3px; border:3px solid var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--accent); background:color-mix(in srgb, var(--card) 70%, transparent); }
  .path { box-shadow:inset 0 0 0 3px var(--accent); }
  .hit { animation:hit .45s ease; }
  @keyframes hit { 35% { transform:scale(1.18); filter:brightness(1.5); } }
  .label { font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .slots { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .slots button { height:46px; border:2px dashed var(--line); border-radius:10px; background:transparent; font-size:20px; font-weight:700; }
  .slots button.full { border-style:solid; background:var(--card); }
  .slots button.now { border-color:var(--accent); background:var(--accent); color:#fff; opacity:1; }
  .runes { display:flex; flex-wrap:wrap; gap:6px; }
  .runes button { width:56px; height:50px; border-radius:10px; border:2px solid var(--line); background:var(--card); font-size:20px; font-weight:700; }
  .runes small { display:block; font-size:10px; font-weight:400; color:var(--muted); line-height:1; }
  .e-火 { color:#e5484d !important; } .e-水 { color:#3e8ae0 !important; } .e-風 { color:#2b9f86 !important; } .e-土 { color:#b07d3c !important; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .go { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 22px; font-weight:600; }
  .ghost { background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px; }
  .msg { min-height:48px; margin-top:8px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:10px; font-size:14px; }
  summary { cursor:pointer; font-weight:600; }
  details ul { margin:6px 0; padding-left:18px; }
  .new { color:var(--accent); font-weight:600; }
  footer { margin-top:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>符文研究室</h1>
  <div class="tabs" id="tabs"></div>
  <div class="goal" id="goal"></div>
  <div class="board" id="board"></div>
  <div class="label" id="orb">咒語（依序執行，最多 4 個符文；點格子可移除）</div>
  <div class="slots" id="slots"></div>
  <div class="label">符文</div>
  <div class="runes" id="runes"></div>
  <div class="actions">
    <button class="go" id="cast">施放</button>
    <button class="ghost" id="reset">重置場地</button>
    <button class="ghost" id="hint">提示</button>
    <button class="go" id="next" hidden>下一關</button>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <details id="noteBox"><summary id="noteTitle">研究筆記</summary><div id="notes"></div></details>
  <details open>
    <summary>怎麼玩</summary>
    <ul>
      <li>咒語從法師（紫色圓圈）位置出發，一開始面向右邊。符文由左到右依序執行。</li>
      <li><b>元素</b>（火、水、風、土）：決定咒語帶著什麼。放兩種元素可能融合成別的東西。</li>
      <li><b>射</b>：往前飛，打到第一個物體並讓元素作用在它身上。停在物體上時射不出去。</li>
      <li><b>爆</b>：元素作用在目前位置和上下左右。</li>
      <li><b>躍</b>：往前跳兩格，不受阻擋。<b>轉</b>：順時針轉向。</li>
      <li>元素會產生什麼效果不會事先告訴你。自己試，筆記會記下來。</li>
    </ul>
  </details>
  <footer>遊戲代號：RL-1（填問卷時請照抄）</footer>
</main>
<script src="engine.js"></script>
<script>
const E = Engine, $ = id => document.getElementById(id);
const LEVELS = [...E.LEVELS, E.SANDBOX];
const GLYPH = { '.':'', '#':'石', 'W':'木', 'G':'草', '~':'水', 'I':'冰', 'L':'燈', 'O':'燈' };
const CLS = { '.':'', '#':'t-s', 'W':'t-w', 'G':'t-g', '~':'t-a', 'I':'t-i', 'L':'t-l', 'O':'t-o' };
const ACT = { '射':'飛出', '爆':'周圍', '躍':'跳兩格', '轉':'轉向' };
const ARROW = ['→', '↓', '←', '↑'];
const ELEMENT_NAMES = ['火', '水', '風', '土', '烈焰', '熔岩', '蒸氣', '寒霜', '生機'];
const REACTION_TOTAL = 24; // 引擎中可發現的「元素 × 物體」反應種類

// 研究筆記與進度只存在這台裝置的瀏覽器
let notes = { fusions:{}, reactions:{} }, done = {};
try { const s = JSON.parse(localStorage.getItem('rune-lab-v1')); if (s) { notes = s.notes; done = s.done; } } catch (e) {}
const save = () => { try { localStorage.setItem('rune-lab-v1', JSON.stringify({ notes, done })); } catch (e) {} };

let li = 0, level, grid, spell = [], casts = 0, pos, busy = false, token = 0, audio, fresh = new Set();

function beep(freq, dur = .1, type = 'triangle') {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

function load(i) {
  token++; li = i; level = LEVELS[i]; spell = []; busy = false;
  resetField();
  $('msg').textContent = '';
}

function resetField() {
  token++; busy = false; grid = E.parse(level.map); casts = 0; pos = { ...level.start, d: 0 };
  $('next').hidden = true; $('msg').textContent = '';
  render();
}

const isSolved = () => level.goal && E.solved(level, grid);
const outOfCasts = () => casts >= level.casts;

function render(view = {}) {
  $('tabs').innerHTML = LEVELS.map((l, i) => `<button class="${i === li ? 'on' : ''} ${done[i] ? 'done' : ''}" data-i="${i}">${l.goal ? i + 1 : '實驗室'}</button>`).join('');
  const goalText = { lamps:'點亮所有的燈', nowater:'讓場上沒有水', grow:'讓虛線格都長出草' }[level.goal] || '沒有目標，自由研究';
  const left = level.goal ? `　剩餘施放 ${level.casts - casts} 次` : `　已施放 ${casts} 次`;
  $('goal').innerHTML = `<b>${level.name}</b>：${goalText}<small>${left}</small>`;
  const g = view.grid || grid, me = view.pos || pos;
  $('board').innerHTML = g.map((t, i) => {
    const isMe = me.y * E.W + me.x === i;
    const target = level.targets && level.targets.some(([x, y]) => y * E.W + x === i);
    return `<div class="cell ${CLS[t]} ${target ? 'target' : ''} ${isMe ? 'me' : ''} ${view.path?.includes(i) ? 'path' : ''} ${view.hit?.includes(i) ? 'hit' : ''}" ${isMe ? `data-me="${view.el ? view.el[0] : ''}${ARROW[me.d]}"` : ''} title="${E.TILE[t]}">${GLYPH[t]}</div>`;
  }).join('');
  $('slots').innerHTML = [0, 1, 2, 3].map(i => `<button class="${spell[i] ? 'full e-' + spell[i] : ''} ${view.step === i ? 'now' : ''}" data-s="${i}" ${busy || !spell[i] ? 'disabled' : ''}>${spell[i] || ''}</button>`).join('');
  $('runes').innerHTML = level.runes.map(r => `<button class="e-${r}" data-r="${r}" ${busy || spell.length >= E.MAXLEN ? 'disabled' : ''}>${r}<small>${ACT[r] || '元素'}</small></button>`).join('');
  $('cast').disabled = busy || !spell.length || outOfCasts() || isSolved();
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => load(+b.dataset.i));
  $('slots').querySelectorAll('button').forEach(b => b.onclick = () => { spell.splice(+b.dataset.s, 1); render(); });
  $('runes').querySelectorAll('button').forEach(b => b.onclick = () => { if (spell.length < E.MAXLEN) { spell.push(b.dataset.r); beep(380 + spell.length * 70, .07); render(); } });
  renderNotes();
}

function renderNotes() {
  const f = Object.entries(notes.fusions), r = Object.entries(notes.reactions);
  $('noteTitle').textContent = `研究筆記（融合 ${f.length}／${Object.keys(E.FUSIONS).length}，反應 ${r.length}／${REACTION_TOTAL}）`;
  const li_ = ([k, v]) => `<li class="${fresh.has(k) ? 'new' : ''}">${v}</li>`;
  $('notes').innerHTML = (f.length || r.length)
    ? `${f.length ? '<div class="label">元素融合</div><ul>' + f.map(li_).join('') + '</ul>' : ''}${r.length ? '<div class="label">反應</div><ul>' + r.sort((a, b) => ELEMENT_NAMES.indexOf(a[0].split('|')[0]) - ELEMENT_NAMES.indexOf(b[0].split('|')[0])).map(li_).join('') + '</ul>' : ''}`
    : '<p>還沒有任何發現。施放咒語看看。</p>';
}

function record(step) {
  const found = [];
  const add = (book, key, text) => { if (!book[key]) { book[key] = text; fresh.add(key); found.push(text); } };
  if (step.fused && E.FUSIONS[step.fused.a + step.fused.b] === step.fused.out || step.fused && E.FUSIONS[step.fused.b + step.fused.a] === step.fused.out) {
    const pair = [step.fused.a, step.fused.b].sort().join('');
    add(notes.fusions, pair, `${step.fused.a} ＋ ${step.fused.b} → ${step.fused.out}`);
  }
  for (const c of step.changes) add(notes.reactions, `${c.el}|${c.from}|${c.to}`, `${c.el}：${E.TILE[c.from]} → ${E.TILE[c.to]}`);
  return found;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function doCast() {
  if (busy || !spell.length || outOfCasts() || isSolved()) return;
  const my = ++token; busy = true; fresh = new Set();
  const result = E.cast(grid, level.start, spell);
  let shown = grid, found = [], anyChange = false;
  for (let i = 0; i < result.steps.length; i++) {
    const s = result.steps[i];
    if (s.path) for (const p of s.path) {
      render({ grid: shown, pos: { x: p % E.W, y: Math.floor(p / E.W), d: s.d }, el: s.el, step: i, path: [p] });
      await sleep(70); if (my !== token) return;
    }
    shown = s.grid; anyChange = anyChange || s.changes.length > 0;
    const news = record(s); found.push(...news);
    render({ grid: shown, pos: s, el: s.el, step: i, hit: [...s.hit, ...s.changes.map(c => c.i)] });
    if (s.changes.length) beep(news.length ? 880 : 520, .18, 'square'); else beep(260 + i * 50, .08);
    $('msg').textContent = s.fused ? `元素變成了「${s.el}」` : s.el ? `帶著「${s.el}」` : '';
    await sleep(s.changes.length ? 520 : 300); if (my !== token) return;
  }
  grid = result.grid; casts++; busy = false; save();
  let text;
  if (isSolved()) {
    done[li] = true; save(); text = '<b style="color:var(--good)">過關！</b>';
    $('next').hidden = li >= LEVELS.length - 1;
    [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .2), i * 130));
  } else if (outOfCasts()) text = '施放次數用完了，按「重置場地」再試。';
  else text = anyChange ? '場地改變了。' : '什麼都沒發生。';
  if (found.length) { text += `<br><span class="new">新發現：${found.join('、')}</span>`; }
  render();
  $('msg').innerHTML = text;
}

$('cast').onclick = doCast;
$('reset').onclick = resetField;
$('hint').onclick = () => { $('msg').textContent = level.hint; };
$('next').onclick = () => load(li + 1);
load(0);
</script>
</body>
</html>
